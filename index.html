<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>다낭 5박 6일 · 가족여행 짐 체크리스트</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#17211e;--muted:#697672;--accent:#087f5b;--accent2:#dff5eb;--line:#e4ebe8;--warn:#fff2cc}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 14px 90px}.hero{background:linear-gradient(135deg,#0b8060,#0e9f75);color:white;border-radius:22px;padding:24px 20px;box-shadow:0 8px 25px #087f5b22}
h1{font-size:25px;margin:0 0 7px}.sub{opacity:.9;font-size:14px}.progressrow{display:flex;align-items:center;gap:12px;margin-top:20px}.bar{height:11px;background:#ffffff45;border-radius:20px;flex:1;overflow:hidden}.fill{height:100%;width:0;background:#fff;border-radius:20px;transition:.2s}.pct{font-weight:800;min-width:45px;text-align:right}
.tools{position:sticky;top:0;z-index:5;background:#f4f7f6ee;backdrop-filter:blur(10px);padding:12px 0 8px;display:grid;grid-template-columns:1fr auto;gap:8px}
input[type=search]{width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:12px 14px;font-size:15px;outline:none}
button{border:0;border-radius:13px;padding:10px 13px;background:white;color:var(--ink);font-weight:700;border:1px solid var(--line)}
.filters{display:flex;gap:7px;margin-bottom:10px;overflow:auto}.filters button.active{background:var(--ink);color:white}.summary{font-size:13px;color:var(--muted);margin:8px 2px 14px}
.section{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0;overflow:hidden}.head{display:flex;align-items:center;padding:15px 16px;cursor:pointer;gap:10px}.head h2{font-size:16px;margin:0;flex:1}.count{font-size:12px;color:var(--muted);background:#f1f4f3;padding:5px 8px;border-radius:20px}.chev{transition:.2s}.section.closed .chev{transform:rotate(-90deg)}.section.closed .items{display:none}
.item{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer}.item:hover{background:#fafcfb}.item input{appearance:none;width:23px;height:23px;border:2px solid #aebbb7;border-radius:7px;margin:0;flex:0 0 auto}.item input:checked{background:var(--accent);border-color:var(--accent);position:relative}.item input:checked:after{content:"✓";color:#fff;font-weight:900;position:absolute;left:4px;top:-1px;font-size:16px}.name{font-size:15px;line-height:23px}.item.done .name{text-decoration:line-through;color:#9aa4a1}.essential{font-size:10px;background:var(--warn);padding:3px 6px;border-radius:7px;margin-left:5px;vertical-align:2px;font-weight:800;color:#6d5700}
.footerbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}.footerbar button{max-width:230px;flex:1}.primary{background:var(--accent);color:white;border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);padding:8px 3px 20px;line-height:1.55}
@media print{.tools,.filters,.footerbar{display:none}.wrap{max-width:none}.section.closed .items{display:block}.hero{box-shadow:none}.item{break-inside:avoid}}
</style></head>
<body><main class="wrap">
<section class="hero"><h1>🌴 다낭 5박 6일 짐 체크리스트</h1><div class="sub">38개월 아이와 함께 · 유모차 없이 가는 가족여행</div>
<div class="progressrow"><div class="bar"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0%</div></div></section>
<div class="tools"><input id="search" type="search" placeholder="준비물 검색 — 예: 선크림, 여권, 수영복"><button id="expand">모두 펼침</button></div>
<div class="filters"><button class="active" data-filter="all">전체</button><button data-filter="todo">미완료</button><button data-filter="essential">필수만</button><button data-filter="done">완료</button></div>
<div class="summary" id="summary"></div><div id="app"></div>
<p class="note">체크 상태는 가족 공용 서버에 저장되어 같은 링크를 연 휴대폰끼리 자동 동기화됩니다. <strong id="sync">연결 중…</strong> 보조배터리는 위탁수하물이 아닌 기내 휴대수하물에 넣으세요.</p>
</main>
<div class="footerbar"><button onclick="window.print()">인쇄 / PDF</button><button id="reset">체크 초기화</button><button class="primary" id="todoBtn">남은 것 보기</button></div>
<script>
const DATA=[{"title": "1. 여권 · 서류 · 결제", "items": [{"name": "여권 — 엄마/아빠/아이", "essential": true}, {"name": "항공권 예약내역 캡처", "essential": true}, {"name": "호텔 예약내역 캡처", "essential": true}, {"name": "여행자보험", "essential": true}, {"name": "여권 사본/사진 휴대폰 저장", "essential": true}, {"name": "해외결제 카드 2장", "essential": true}, {"name": "베트남 동(VND) 소액 현금", "essential": false}, {"name": "비상용 달러", "essential": false}, {"name": "eSIM/로밍 준비", "essential": true}, {"name": "호텔 영문 주소·연락처 저장", "essential": false}]}, {"title": "2. 기내 가방", "items": [{"name": "아이 여벌 상하의 1~2세트", "essential": true}, {"name": "팬티 2~3장", "essential": true}, {"name": "비상용/밤 기저귀 2~3개", "essential": false}, {"name": "물티슈·티슈", "essential": true}, {"name": "지퍼백·비닐봉투", "essential": true}, {"name": "아이 물병/빨대컵", "essential": true}, {"name": "간식 3~5종", "essential": true}, {"name": "애착인형/애착물", "essential": true}, {"name": "스티커북·작은 장난감", "essential": false}, {"name": "태블릿 + 키즈 헤드폰", "essential": false}, {"name": "얇은 가디건/담요", "essential": true}, {"name": "해열제 + 체온계", "essential": true}, {"name": "멀미봉투", "essential": false}, {"name": "부모 여벌 티셔츠 1장", "essential": false}]}, {"title": "3. 아이 옷", "items": [{"name": "반팔 상의 6~7장", "essential": true}, {"name": "반바지/얇은 하의 5~6장", "essential": true}, {"name": "외출복 1~2세트", "essential": false}, {"name": "잠옷 3세트", "essential": true}, {"name": "얇은 긴팔 2장", "essential": true}, {"name": "얇은 긴바지 1~2장", "essential": false}, {"name": "속옷 8~10장", "essential": true}, {"name": "양말 3~4켤레", "essential": false}, {"name": "가디건/얇은 바람막이", "essential": true}, {"name": "모자 1~2개", "essential": true}, {"name": "운동화", "essential": false}, {"name": "샌들", "essential": true}, {"name": "아쿠아슈즈", "essential": true}]}, {"title": "4. 물놀이", "items": [{"name": "래시가드 2벌", "essential": true}, {"name": "수영복 1~2벌", "essential": false}, {"name": "아쿠아슈즈", "essential": true}, {"name": "아이 구명조끼", "essential": true}, {"name": "튜브", "essential": false}, {"name": "튜브 펌프", "essential": false}, {"name": "물놀이 장난감", "essential": false}, {"name": "방수 휴대폰팩", "essential": false}, {"name": "젖은 옷용 방수백", "essential": true}, {"name": "수영 후 가운/타월", "essential": false}, {"name": "키즈 선크림", "essential": true}, {"name": "선스틱", "essential": false}]}, {"title": "5. 아이 상비약", "items": [{"name": "아세트아미노펜 해열제", "essential": true}, {"name": "이부프로펜 해열제", "essential": true}, {"name": "체온계", "essential": true}, {"name": "식염수", "essential": false}, {"name": "콧물 흡입기", "essential": false}, {"name": "평소 복용/처방약", "essential": true}, {"name": "ORS 경구수분보충제", "essential": true}, {"name": "유산균", "essential": false}, {"name": "밴드·방수밴드", "essential": false}, {"name": "소독제/거즈", "essential": false}, {"name": "아이용 모기기피제", "essential": true}, {"name": "벌레 물린 후 바르는 제품", "essential": false}]}, {"title": "6. 햇빛 · 모기 · 날씨", "items": [{"name": "아이용 모기기피제", "essential": true}, {"name": "부모용 모기기피제", "essential": false}, {"name": "모기패치", "essential": false}, {"name": "아이 선크림", "essential": true}, {"name": "성인 선크림", "essential": true}, {"name": "아이 선글라스", "essential": false}, {"name": "부모 선글라스", "essential": false}, {"name": "챙 넓은 모자", "essential": true}, {"name": "접이식 우산", "essential": true}, {"name": "아이 우비", "essential": false}]}, {"title": "7. 아이 식사 · 간식", "items": [{"name": "김/김자반", "essential": true}, {"name": "즉석밥 2~3개", "essential": false}, {"name": "아이용 죽 2~3개", "essential": false}, {"name": "평소 좋아하는 과자/간식", "essential": true}, {"name": "초반용 멸균우유", "essential": false}, {"name": "아이 숟가락·포크", "essential": false}, {"name": "음식가위", "essential": true}, {"name": "빨대", "essential": false}, {"name": "물병/빨대컵", "essential": true}, {"name": "턱받이", "essential": false}, {"name": "일회용 장갑", "essential": false}, {"name": "식품용 지퍼백", "essential": false}]}, {"title": "8. 배변 · 위생", "items": [{"name": "팬티 넉넉하게", "essential": true}, {"name": "밤기저귀", "essential": false}, {"name": "비상용 팬티형 기저귀", "essential": false}, {"name": "휴대용 변기커버", "essential": false}, {"name": "변기 소독티슈", "essential": false}, {"name": "물티슈", "essential": true}, {"name": "여벌 하의", "essential": true}, {"name": "지퍼백/비닐봉투", "essential": true}, {"name": "손소독제", "essential": true}]}, {"title": "9. 수면", "items": [{"name": "애착인형/애착이불", "essential": true}, {"name": "아이 잠옷", "essential": true}, {"name": "작은 베개(필요 시)", "essential": false}, {"name": "수면등(필요 시)", "essential": false}, {"name": "화이트노이즈 앱", "essential": false}]}, {"title": "10. 이동용품", "items": [{"name": "타는 캐리어/트라이크 캐리어", "essential": true}, {"name": "네임택", "essential": true}, {"name": "캐리어 잠금장치", "essential": false}]}, {"title": "11. 엄마 · 아빠 옷", "items": [{"name": "반팔 5~6장/인", "essential": true}, {"name": "반바지 3~4장/인", "essential": true}, {"name": "긴바지 1장/인", "essential": false}, {"name": "얇은 긴팔 1장/인", "essential": true}, {"name": "속옷 6~7장/인", "essential": true}, {"name": "잠옷", "essential": true}, {"name": "수영복/래시가드", "essential": true}, {"name": "슬리퍼", "essential": true}, {"name": "운동화", "essential": false}, {"name": "모자", "essential": false}]}, {"title": "12. 세면 · 화장품", "items": [{"name": "칫솔·치약", "essential": true}, {"name": "클렌징/기초화장품", "essential": true}, {"name": "아이 로션/워시", "essential": true}, {"name": "면도기", "essential": false}, {"name": "렌즈/렌즈액", "essential": false}, {"name": "여성용품", "essential": false}, {"name": "면봉", "essential": false}, {"name": "빗·머리끈", "essential": false}]}, {"title": "13. 전자제품", "items": [{"name": "휴대폰", "essential": true}, {"name": "휴대폰 충전기", "essential": true}, {"name": "태블릿 + 충전기", "essential": false}, {"name": "보조배터리 — 반드시 기내", "essential": true}, {"name": "키즈 헤드폰", "essential": false}, {"name": "스마트워치 충전기", "essential": false}, {"name": "멀티 USB 충전기", "essential": true}, {"name": "멀티탭", "essential": false}, {"name": "충전 케이블 여분", "essential": false}]}, {"title": "14. 빨래 · 정리", "items": [{"name": "소분 세탁세제", "essential": false}, {"name": "빨래망", "essential": false}, {"name": "빨랫줄/집게", "essential": false}, {"name": "지퍼백 여러 크기", "essential": true}, {"name": "압축팩", "essential": false}, {"name": "젖은 수영복용 방수백", "essential": true}, {"name": "접이식 장바구니", "essential": false}]}, {"title": "15. 부모 상비약", "items": [{"name": "해열진통제", "essential": true}, {"name": "소화제", "essential": false}, {"name": "지사제", "essential": false}, {"name": "감기약", "essential": false}, {"name": "알레르기약", "essential": false}, {"name": "멀미약", "essential": false}, {"name": "밴드/소독제", "essential": false}, {"name": "평소 복용약", "essential": true}]}, {"title": "16. 출발 직전 최종 확인", "items": [{"name": "여권 3개 확인", "essential": true}, {"name": "지갑·카드·현금", "essential": true}, {"name": "휴대폰", "essential": true}, {"name": "보조배터리는 기내가방에", "essential": true}, {"name": "아이 해열제·체온계 기내가방에", "essential": true}, {"name": "아이 여벌옷 기내가방에", "essential": true}, {"name": "호텔/항공 예약 캡처", "essential": true}, {"name": "냉장고·가스·창문 확인", "essential": false}, {"name": "쓰레기 비우기", "essential": false}]}];
let state={}; let filter="all"; let syncTimer=null; let applying=false;
async function loadShared(){try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok){state=await r.json();render();setSync('동기화됨')}}catch(e){setSync('연결 확인 중')}}
async function saveShared(){try{setSync('저장 중…');const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});if(r.ok)setSync('동기화됨');else setSync('저장 실패')}catch(e){setSync('연결 끊김')}}
function setSync(t){const e=document.getElementById('sync');if(e)e.textContent=t}
function save(){clearTimeout(syncTimer);syncTimer=setTimeout(saveShared,120)}
const app=document.getElementById("app"), search=document.getElementById("search");
function id(s,i){return s+"-"+i}
function render(){
 const q=search.value.trim().toLowerCase(); app.innerHTML="";
 let total=0,done=0,visibleTotal=0;
 DATA.forEach((sec,si)=>{
   sec.items.forEach((it,ii)=>{total++;if(state[id(si,ii)])done++});
   const rows=sec.items.map((it,ii)=>({it,ii,key:id(si,ii),checked:!!state[id(si,ii)]}))
    .filter(x=>(!q||x.it.name.toLowerCase().includes(q))&&(filter==="all"||(filter==="todo"&&!x.checked)||(filter==="done"&&x.checked)||(filter==="essential"&&x.it.essential)));
   if(!rows.length)return; visibleTotal+=rows.length;
   const el=document.createElement("section"); el.className="section"; el.innerHTML=`<div class="head"><span class="chev">▼</span><h2>${sec.title}</h2><span class="count">${rows.filter(x=>x.checked).length}/${rows.length}</span></div><div class="items"></div>`;
   el.querySelector(".head").onclick=()=>el.classList.toggle("closed");
   const box=el.querySelector(".items");
   rows.forEach(x=>{const r=document.createElement("label");r.className="item"+(x.checked?" done":"");r.innerHTML=`<input type="checkbox" ${x.checked?"checked":""}><span class="name">${x.it.name}${x.it.essential?'<span class="essential">필수</span>':""}</span>`;r.querySelector("input").onchange=e=>{state[x.key]=e.target.checked;save();render()};box.appendChild(r)});
   app.appendChild(el);
 });
 const p=total?Math.round(done/total*100):0; document.getElementById("pct").textContent=p+"%";document.getElementById("fill").style.width=p+"%";
 document.getElementById("summary").textContent=`전체 ${total}개 중 ${done}개 완료 · ${total-done}개 남음${(q||filter!=="all")?` · 현재 ${visibleTotal}개 표시`:""}`;
}
search.oninput=render;
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()});
document.getElementById("todoBtn").onclick=()=>{filter="todo";document.querySelectorAll(".filters button").forEach(x=>x.classList.toggle("active",x.dataset.filter==="todo"));render();scrollTo({top:180,behavior:"smooth"})};
document.getElementById("expand").onclick=()=>{const secs=[...document.querySelectorAll(".section")];const any=secs.some(x=>x.classList.contains("closed"));secs.forEach(x=>x.classList.toggle("closed",!any));document.getElementById("expand").textContent=any?"모두 접기":"모두 펼침"};
document.getElementById("reset").onclick=()=>{if(confirm("모든 체크를 초기화할까요?")){state={};save();render()}};
render();loadShared();setInterval(async()=>{try{const r=await fetch('/api/state',{cache:'no-store'});if(r.ok){const next=await r.json();if(JSON.stringify(next)!==JSON.stringify(state)){state=next;render()}}}catch(e){}},2000);
</script></body></html>
